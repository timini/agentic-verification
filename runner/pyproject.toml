[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tsa"
version = "0.3.0"
description = "Runner for the Agentic Verification Claude Code plugin: measures whether a pytest suite would catch broken code"
requires-python = ">=3.12"
dependencies = [
    # Exact pin: we call mutmut's operator generator directly, which is not a public API.
    "mutmut==3.8.0",
    "coverage>=7.16,<8",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
agentic-verification = "tsa.cli:main"
tsa = "tsa.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["src/tsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
