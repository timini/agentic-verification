# Linux replication of H1, H3 and H5 on two corpus projects (see study/PREREGISTRATION.md).
# Manual only: it runs for about an hour and its raw data is uploaded as an artifact.
name: study-replication

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Corpus projects to replicate
        default: "toolz cachetools"

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: study
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.2"
      - run: uv python install 3.12
      - run: uv sync -p 3.12
      - run: uv run python -m harness.corpus ${{ inputs.projects }}
      - run: uv run python -m experiments.e0_baseline ${{ inputs.projects }}
      - run: uv run python -m experiments.e5_overhead ${{ inputs.projects }}
      - run: uv run python -m experiments.e1_overlap ${{ inputs.projects }}
      - run: uv run python -m experiments.e3_effects ${{ inputs.projects }}
      - uses: actions/upload-artifact@v4
        with:
          name: study-replication-linux
          path: study/data/raw
